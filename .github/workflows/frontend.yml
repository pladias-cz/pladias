name: Frontend CI

on:
    pull_request:
        paths:
            - "frontend/**"
            - ".github/workflows/frontend.yml"
    push:
        branches: [main]
        paths:
            - "frontend/**"
            - ".github/workflows/frontend.yml"

defaults:
    run:
        working-directory: frontend

jobs:
    check:
        name: Lint, i18n audit, build, test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            # Neblokuje PR, dokud není splacen pre-existující lint dluh (~157 chyb,
            # hlavně no-explicit-any). Výsledky se zobrazují jako annotace. (docs/refactoring.md, sekce I)
            - name: Lint (non-blocking)
              run: npm run lint
              continue-on-error: true

            - name: i18n audit
              run: npm run i18n:check

            - name: Build
              run: npm run build

            - name: Test
              run: npm run test
