name: Frontend CI

on:
    pull_request:
        paths:
            - "frontend/**"
            - ".github/workflows/frontend.yml"
    push:
        branches: [main]
        paths:
            - "frontend/**"
            - ".github/workflows/frontend.yml"

defaults:
    run:
        working-directory: frontend

jobs:
    check:
        name: Lint, i18n audit, build, test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            # Guard proti regresi – celé frontend/src má být čistý TypeScript
            - name: Guard – žádné .js/.jsx soubory ve src
              run: |
                  found=$(find src \( -name '*.js' -o -name '*.jsx' \))
                  if [ -n "$found" ]; then
                      echo "Ve frontend/src zbývají JS/JSX soubory:"
                      echo "$found"
                      exit 1
                  fi

            - name: Lint
              run: npm run lint

            - name: i18n audit
              run: npm run i18n:check

            - name: Build
              run: npm run build

            - name: Test
              run: npm run test
