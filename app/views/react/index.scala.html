@(jsFile: String, cssFiles: List[String], request: play.mvc.Http.Request)
<!DOCTYPE html>
<html lang="cs-CZ" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link rel="shortcut icon" type="image/png" href="@routes.Assets.at("favicon.png")">

</head>
<body>
<!-- flash hlášky pro React FE – data atributy místo inline scriptu kvůli
     Content-Security-Policy script-src 'self' (docs/security.md, pův. L2);
     čte FeatureDetail.tsx -->
<div id="react-app" data-flash-success="@request.flash.get("success")" data-flash-error="@request.flash.get("error")"></div>
@for(css <- cssFiles) {
<link href="@css" rel="stylesheet">
}
<script src="@jsFile" type="module"></script>
</body>
</html>
