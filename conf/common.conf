# This is the shared configuration file for the application.
# ~~~~~

# Secret key
# ~~~~~
# The secret key is used to secure cryptographics functions.
# If you deploy your application to several instances be sure to use the same key!
# create via: openssl rand -base64 48
play.http.secret.key = ""

# The application languages
# ~~~~~
play.i18n.langs = ["cs", "en"]

# Global object class
# ~~~~~
# Define the Global object class for this application.
# Default to Global in the root package.
#application.global=global.Global

# Router
# ~~~~~
# Define the Router object to use for this application.
# This router will be looked up first when the application is starting up,
# so make sure this is the entry point.
# Furthermore, it's assumed your route file is named properly.
# So for an application router like `conf/my.application.Router`,
# you may need to define a router file `my.application.routes`.
# Default to Routes in the root package (and `conf/routes`)
# application.router=my.application.Routes

# Database configuration
# ~~~~~
# You can declare as many datasources as you want.
# By convention, the default datasource is named `default`
#
#db.default.driver=org.h2.Driver
#db.default.url="jdbc:h2:mem:play"
#db.default.user=sa
#db.default.password=""
#

secretKey = ""

# Email configuration
mail.smtp.host = smtp.seznam.cz
mail.smtp.port = 465
mail.smtp.auth = true
mail.smtp.starttls.enable = false
mail.smtp.starttls.required = false
mail.smtp.ssl.enable = true
mail.user = "pladias.sender@seznam.cz"
mail.from = "pladias.sender@seznam.cz"
mail.password = ""

# sql logging
#db.default.logStatements= true
#logger.com.jolbox=DEBUG

#features to simplify debugging when developing new feature (this should never be set to true in production)
debug = false

# You can expose this datasource via JNDI if needed (Useful for JPA)
# db.default.jndiName=DefaultDS

# Evolutions
# ~~~~~
# You can disable evolutions if needed
#evolutionplugin=disabled
play.evolutions.db.default.enabled = false
play.evolutions.db.replica.enabled = false

# Ebean configuration
# ~~~~~
# You can declare as many Ebean servers as you want.
# By convention, the default server is named `default`
#
ebean.default.databasePlatform = postgis.PostGisPlatform
#com.avaje.ebean.config.dbplatform.PostgresPlatform
ebean.default = ["models.*"]
db.default.maxConnectionsPerPartition = 100 // this say what Max connection your Play Framework need ti maintain
db.default.minConnectionsPerPartition = 10 //During start minimum how many DB connection it should have
db.default.acquireIncrement = 10  // Once Db connection exceed to maxConnectionsPerPartition then how much it need to assign more in pool
# If you need a full JDBC configuration use the following :
db.default.driver = org.postgresql.Driver
db.default.hikaricp.connectionTestQuery = "SELECT 1"
#jpa.dialect=org.hibernatespatial.postgis.PostgisDialect
#db.default.logSql=true

# Replica databáze - read-only operace
# Ve výchozím stavu odkazuje na master (pro vývoj a prostředí bez repliky)
# V produkci přepište hodnoty na skutečnou repliku
db.replica.url=${db.default.url}
db.replica.username=${db.default.username}
db.replica.password=${db.default.password}
db.replica.driver=${db.default.driver}
db.replica.hikaricp.connectionTestQuery=${db.default.hikaricp.connectionTestQuery}
db.replica.maxConnectionsPerPartition = 50
db.replica.minConnectionsPerPartition = 5

# Replica Ebean server
# Poznámka: readOnly flag není zde nastaven - v dev prostředí ukazuje na master
# Pro produkci s skutečnou replikou lze nastavit programově nebo přes custom config
# Důležité: ebean.replica musí být LIST, nelze kombinovat s dalšími property
ebean.replica = ["models.*"]

# Geoserver configuration
geoserver.host = localhost
geoserver.port = 8080

# Timeout
play.server.http.idleTimeout = 480s
play.server.pekko.requestTimeout = 480s

# File Upload
play.http.parser.maxMemoryBuffer=10MB
play.http.parser.maxDiskBuffer = 400MB

# Logger
# ~~~~~
# You can also configure logback (http://logback.qos.ch/),
# by providing an application-logger.xml file in the conf directory.

# Root logger:
logger.root = ERROR

# Logger used by the framework:
logger.play = INFO

# Logger provided to your application:
logger.application = DEBUG

play.modules.enabled += "modules.ServicesModule"
play.modules.enabled += "modules.RepositoriesModule"
play.modules.enabled += "modules.SchedulerModule"
play.modules.enabled += "modules.SingleThreadedExecutorModule"
play.modules.enabled += "modules.TaxonConfigModule"
play.modules.enabled += "modules.SecurityModule"

play.modules.disabled += "play.api.i18n.I18nModule"

play.i18n.formats.properties = true
play.i18n.formats.yaml = true

user {}

# CSRF (docs/security.md M1): filtr zapnutý (Play default). Token generuje filtr
# do cookie PLAY_CSRF_TOKEN (httpOnly=false – čte ji React apiClient a posílá ji
# zpět hlavičkou Csrf-Token); login formulář nese token přes @helper.CSRF.formField.
play.filters.csrf.cookie.name = "PLAY_CSRF_TOKEN"

play.filters.enabled += play.filters.hosts.AllowedHostsFilter

play.filters.hosts {
  # Allow requests to production domains.
  allowed = ["dalibor.ibot.cas.cz", "pladias.ibot.cas.cz",  "cevs.ibot.cas.cz", "pladias.cz"]
}

# Content-Security-Policy (docs/security.md, pův. L2) – defense-in-depth proti XSS.
# Inline scripty jsou zakázané (flash hlášky pro FE vozí data-flash-* atributy,
# viz app/views/react/index.scala.html), scripty a styly FE jsou ve vlastních
# assetech; style-src 'unsafe-inline' kvůli backend rich-textu (import messages),
# Bootstrap CSS login stránky z jsdelivr CDN (se SRI); mapové dlaždice (WMS →
# img-src) i GeoJSON (WFS → connect-src) přicházejí z GeoServerů CZ a SK
# instance (slovak.conf). X-Frame-Options: DENY zůstává z defaultu filtru.
play.filters.headers.contentSecurityPolicy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://geoserver.ibot.cas.cz https://geoserver.sav.sk; font-src 'self' data:; connect-src 'self' https://geoserver.ibot.cas.cz https://geoserver.sav.sk; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"

# chrání všechny ne-GET/HEAD/OPTIONS requesty, ne jen ty s Cookie/Authorization
# hlavičkou – konzervativnější než Play default, ponecháno z původní konfigurace
play.filters.csrf.header.protectHeaders = null

dbGeomUtmSrid = 32633
map.geoserverCommonUrl = "https://geoserver.ibot.cas.cz"
map.center = "[15.4, 49.85]"
map.zoom = 7.46
map.extent = "[1335643, 6190242, 2114900, 6656906]"
districtBufferMeters = 5000

check.minAltitude = 100
check.maxAltitude = 1610

allTaxaForRevisor = true

menu.showMaps = true
