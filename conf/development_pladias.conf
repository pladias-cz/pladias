include "pladias"

db.default.url="jdbc:postgresql://pladias_master:5432/pladias" #pladias|mechobias
db.default.username=play
db.default.password=play

#features to simplify debugging when developing new feature (this should never be set to true in production)
debug=true

# Geoserver configuration
geoserver.host=geoserverprivate
geoserver.port=8080

license.default = "P-P-P"  #default record license name

play.filters.hosts {
  # Allow requests to example.com, its subdomains, and localhost.
  allowed = ["dalibor.ibot.cas.cz", "pladias.ibot.cas.cz", "pladias.cz", "localhost:9000", "localhost:9443", "localhost:9444"]
}

# E-mails go to the local Mailpit container (docker-development: service "mailpit"),
# nothing is delivered; inspect them at http://localhost:8025
mail.smtp.host = mailpit
mail.smtp.port = 1025
mail.smtp.auth = false
mail.smtp.starttls.enable = false
mail.smtp.starttls.required = false
mail.smtp.ssl.enable = false
mail.password = development

