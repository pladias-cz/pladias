PublicationUpdateService:
    taxonStatusChangeMapDesignerContents: |
                                          Taxon "{0}" je nyni ve stavu "{1}". Zmenu provedl uzivatel {2}.
                                          {3}
    taxonStatusChangeRevisorsMailContents: Taxon "{0}" je nyni ve stavu "{1}".
    mapUploaded: Mapa k taxonu {0} nahrána na server
    mapUploadedMailContents: |
                             {0}
                             Vážení autoři,
                             v této zprávě Vám zasíláme odkaz na právě vygenerovanou mapu. Ta je (1) vytvořená v tom schématu (typu) mapy, který jste si zvolili v mapovací aplikaci, (2) podle záznamů v databázi, které jste zkontrolovali, roztřídili, proznačili a schválili, a (3) upravená podle případných dodatečných instrukcí a upozornění v Poznámce autora mapy. 
                             Mapu prosím pečlivě zkontrolujte, porovnejte ji s náhledem v mapovací aplikaci, a ujistěte se, že ve všech kvadrantech máte ten znak, který tam chcete mít. Nezapomeňte zkontrolovat především veškeré nestandardní případy a jestli byly správně zapracovány Vaše požadavky z pole "Poznámka pro tisk mapy" (např. pokud rozlišujete recentní vs. zaniklý výskyt a v nějakém kvadrantu druh prokazatelně vyhynul až po roce 2000, čili je potřeba udělat manuální úpravu symbolu).
                             Toto je poslední možná kontrola Vašich map před odesláním článku do redakce časopisu Preslia. Pokud objevíte nějaký problém, informujte prosím obratem Z. Kaplana (kaplan@ibot.cas.cz). Pokud nepřijde žádná odezva ve lhůtě stanovené pro příslušnou sadu map (obvykle 2–3 dny), bude mapa považována za definitivní.

